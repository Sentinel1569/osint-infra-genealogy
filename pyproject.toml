[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infragen"
version = "1.0.0"
description = "Digital Infrastructure Genealogy: map how a domain's certificates, DNS, IPs and hosting changed over time."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
infragen = "infragen.__main__:main"

[tool.setuptools.packages.find]
include = ["infragen*"]

[tool.setuptools.package-data]
infragen = ["static/*", "static/vendor/*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
